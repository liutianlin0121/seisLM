[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "seisLM"
version = "0.2.2.dev0"
description = "A foundation model for seismic waveforms"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{name = "Tianlin Liu"}]
dependencies = [
    "torch>=2.6,<3",
    "numpy>=1.26,<2; python_version < '3.13'",
    "numpy>=2.1,<3; python_version >= '3.13'",
    "einops>=0.8,<0.9",
    "ml-collections>=0.1,<2",
    "huggingface-hub>=0.26,<2",
    "safetensors>=0.4,<1",
]

[project.optional-dependencies]
training = [
    "lightning>=2.6,<3",
    "seisbench>=0.8,<0.9; python_version < '3.13'",
    "seisbench>=0.9,<0.10; python_version >= '3.13'",
    "pandas>=2,<3",
    "scikit-learn>=1.4,<2",
    "wandb>=0.18,<1",
]
notebooks = [
    "seisLM[training]",
    "matplotlib>=3.8,<4",
    "plotly==7.1.0",
    "gdown>=5,<6",
    "ipykernel>=6,<8",
]

[project.urls]
Repository = "https://github.com/liutianlin0121/seisLM"
Paper = "https://arxiv.org/abs/2410.15765"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "build>=1.2,<2",
    "transformers==4.44.2; python_version < '3.13'",
]
notebook = [
    "nbclient>=0.10,<0.11",
    "nbformat>=5.10,<6",
    "ipykernel>=6,<8",
    "matplotlib==3.11.2",
    "obspy==1.5.1",
]
browser = [
    "playwright==1.64.0",
]

[tool.setuptools.packages.find]
include = ["seisLM", "seisLM.*"]
namespaces = false

[tool.setuptools.package-data]
seisLM = [
    "configs/pretrain/*.json",
    "configs/phasepick/*.json",
    "configs/foreshock_aftershock/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests", "seisLM/model/foundation/conv_encoder_test.py"]

# The locked developer environment uses CUDA 13.0 on DGX Spark and a small
# CPU-only build on Linux x86_64 (including CI). Other platforms use PyPI.
# These installer settings do not constrain the metadata of the built wheel.
[tool.uv.sources]
torch = [
    {index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'"},
    {index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'"},
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

line-length = 80
indent-width = 2

# Match the oldest supported Python.
target-version = "py311"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E4", "E7", "E9", "F"]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"
