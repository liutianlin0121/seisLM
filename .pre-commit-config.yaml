repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.1.0
    hooks:
      - id: end-of-file-fixer
  - repo: local
    hooks:
      - id: run-tests
        name: Test maintained interfaces
        entry: uv run --locked --group dev --group notebook pytest tests
        language: system
        pass_filenames: false
        always_run: true
